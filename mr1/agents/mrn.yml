# MRn — level-parameterized orchestrator config (role=orchestrator, levels 2+)
# "MRn" here is hierarchy-level notation, not an agent type: this file
# configures model/tools by mr_level for the ephemeral (lifecycle=task_scoped)
# orchestrator execution path. The persisted orchestrator path (children
# created via `create_child_agent`) reuses these same tool/model choices
# but is lifecycle=project_scoped/standing instead — see
# docs/architecture/AGENT_ONTOLOGY.md.

name: mrn
level_models:
  1: haiku    # MR1 (role=orchestrator, lifecycle=standing)
  2: haiku    # MR2: typical project-scoped orchestrator level
  3: haiku    # MR3: typical task-scoped orchestrator level
  4: haiku    # MR4+: deeper orchestrator levels
default_model: haiku
allowed_tools:
  - Read
  - Glob
  - Grep
lifecycle: task_scoped  # Ephemeral path: spawned per-job, then dies.
memory_access: full
